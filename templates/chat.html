<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Chat with {{ botname }}</title>
<style type="text/css">
    #transcript {
        background-color:#ffc;
        height:200px;
        overflow-y:scroll;
        padding: 0 .5em;
        width:400px;
    }
    #transcript div {
        margin-top:4px;
        text-align:right;
    }
    #transcript div.bot {
        text-align:left;
    }
    #transcript span {
        background-color: #cdf;
    }
    #transcript span.bot {
        background-color: #ddd;
        font-family: monospace;
    }

    @media (max-width: 600px) {
        #transcript {
            font-size: larger;
        }
        .button,
        .input {
            font-size: large;
        }
        .input {
            width:400px;
        }
    }
</style>
</head>
<body>

	<h1>Chat with {{ botname }}</h1>

<div id="transcript">
	<span class="bot">&gt; {{ intro }}</span><br>
</div>

<form id="chatform" action="#" method="GET">
     <label><input type="text" name="text" id="text" size="50" class="input"></label>
     <input type="submit" value="Send" class="button">
</form>

<hr>

{% if user %}
<p id="credit">Credit: {{ user }}. <a href="https://gist.github.com/{{ user }}/{{ hash }}">View source</a>. <a href="?reload">Reload source</a></p>
{% else %}
<p id="credit">This is a demo of the eliza submodule of the <a href="http://www.nltk.org/api/nltk.chat.html">NLTK chat module</a>.</p>
{% endif %}

<p>Want to make your own bot? Read the <a href="https://osric.com/chris/accidental-developer/2022/08/diy-gist-chatbots/">bot-making instructions</a>.</p>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
	integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
	crossorigin="anonymous"></script>
<script type="text/javascript">
    $("#chatform").submit(function() {
        endpoint = '/chat-api';
        {% if user and gist_id %}
	    endpoint = endpoint + '/{{ user }}/{{ gist_id }}';
	{% endif %}
        $('#transcript').append('<div><span>' + this.text.value + '</span></div>');
	    jQuery.get(endpoint + '?text=' + this.text.value, 
                    function(data) {
                       $('#transcript').append('<span class="bot">&gt; ' + data + '<br></span>');
                       $('#transcript').scrollTop($('#transcript').prop('scrollHeight'));
                    });
        this.text.value = '';
        return false;
    });

</script>
</body>
</html>
